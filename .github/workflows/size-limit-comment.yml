# Posts the size report produced by the "Size limit" workflow as a PR comment.
# Split into a separate workflow_run job so it works for PRs from forks: the
# pull_request job runs fork code with a read-only token, while this job has a
# write token but only reads size numbers from the uploaded artifact and never
# executes PR code — the markdown is rendered here, from the trusted checkout.
# This job never fails on a budget overrun; branch protection must require the
# "Size limit / size" job from size-limit.yml, not this one. It does fail when it
# cannot identify the PR to comment on, which is a broken handoff rather than a
# size result.
name: Size limit comment
on:
  workflow_run:
    workflows: ['Size limit']
    types: [completed]
permissions:
  contents: read # for the trusted checkout below
  pull-requests: write
  actions: read
# The list-then-create/update of the sticky comment is a check-then-act race if
# two runs for the SAME PR overlap (e.g. a double re-run); serialize per PR. A
# repo-global group would let a burst of PRs cancel each other's pending runs
# (GitHub keeps at most one pending run per group). No cancel-in-progress so
# the newest run still lands its update.
concurrency:
  group: size-limit-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
jobs:
  comment:
    # success = budgets pass, failure = budgets exceeded; both upload a report.
    # Skip cancelled runs, which upload nothing.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        id: download
        # A run that failed before measuring uploads no artifact; skip quietly.
        continue-on-error: true
        with:
          name: size-limit-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/github-script@v9
        if: steps.download.outcome == 'success'
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const headSha = run.head_sha;
            // A fork PR's head sha is not associated with any PR in the base repo,
            // so it cannot be looked up from the sha alone; the measuring job
            // carries the number across instead. That artifact is written by a job
            // running fork code, so the number is treated as a claim and verified:
            // a PR whose head is this exact sha in this exact head repository is
            // necessarily the PR that was measured, whoever wrote the file.
            const number = Number(fs.readFileSync('pr', 'utf8').trim());
            if (!Number.isInteger(number) || number <= 0) {
              core.setFailed(`Malformed PR number in artifact: ${JSON.stringify(number)}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.head.sha !== headSha || pr.head.repo?.full_name !== run.head_repository.full_name) {
              // Either the artifact named the wrong PR, or the branch moved on
              // after it was measured. Neither is a report worth posting, and
              // neither should pass silently — a skipped comment is otherwise
              // indistinguishable from a healthy run.
              core.setFailed(
                `PR #${number} is at ${pr.head.sha} on ${pr.head.repo?.full_name}, ` +
                  `but the report was measured at ${headSha} on ${run.head_repository.full_name}.`
              );
              return;
            }
            // Render the report with this repo's report.mjs (from the trusted
            // checkout); the artifact contributes only the head/base numbers.
            const { execFileSync } = require('child_process');
            const body = execFileSync('node', ['.github/size-limit/report.mjs', '.', headSha], {
              encoding: 'utf8',
            });
            const marker = '<!-- size-limit-report -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            // Only adopt our own bot's comment: a user quoting the marker must
            // not become the update target (editing it would 403 anyway).
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body && c.body.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
