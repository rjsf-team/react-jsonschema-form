name: CI

on:
  push:
    branches: [main, v7]
  pull_request:
    branches: [main, v7]

jobs:
  # None of these depend on the Node version or on a build, so they run once in their own job rather
  # than on one leg of the build matrix: a failure reports on its own instead of cancelling the other
  # legs and withholding every build and test result. `cs-check` runs ahead of `lint` so the one
  # failure that has an automatic fix is never hidden behind the slowest step.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - run: pnpm dedupe --check
      - run: pnpm run cs-check
      - run: pnpm run lint
      - run: pnpm run knip

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile

      - name: Build with Netlify badge
        run: pnpm run build-serial
        env:
          VITE_SHOW_NETLIFY_BADGE: true
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Build
        run: pnpm run build-serial
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - if: matrix.node-version == '24.x'
        uses: actions/upload-artifact@v7
        with:
          name: playground
          path: packages/playground/dist
      - if: matrix.node-version == '24.x'
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: packages/docs/build
      - run: pnpm test

  deploy_playground_and_docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    name: Deploy playground and docs to GitHub Pages
    needs: [build, checks]
    steps:
      - name: Download built playground
        uses: actions/download-artifact@v8
        with:
          name: playground
          path: dist
      - name: Download built docs
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: dist/docs
      - name: Deploy playground + docs to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          keep_history: true
          target_branch: gh-pages
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
