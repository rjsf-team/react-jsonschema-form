name: Size limit
on: pull_request
permissions:
  pull-requests: write
jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: pnpm
          build_script: build
          # The base-branch pass runs against a checkout that may predate size-limit
          # (e.g. while the PR introducing it is open); report no results there
          # instead of crashing on the missing dependency/config.
          script: sh -c "if [ -f .size-limit.json ]; then npx --no-install size-limit --json; else echo []; fi"
