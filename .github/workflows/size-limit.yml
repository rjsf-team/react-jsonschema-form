name: Size limit
on: pull_request
permissions:
  contents: read
jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Measure PR head
        run: |
          pnpm install
          pnpm run build
          # size-limit exits non-zero when a budget is exceeded but still emits
          # JSON; record the outcome and enforce it at the end so the report
          # comment is produced either way.
          if pnpm exec size-limit --json > "$RUNNER_TEMP/head.json"; then
            echo ok > "$RUNNER_TEMP/status"
          else
            echo fail > "$RUNNER_TEMP/status"
          fi
          # Preserve the report script before the base checkout replaces the tree.
          cp .size-limit/report.mjs "$RUNNER_TEMP/report.mjs"
      - name: Measure base branch
        run: |
          git fetch --no-tags --depth 1 origin ${{ github.event.pull_request.base.sha }}
          git checkout -f ${{ github.event.pull_request.base.sha }}
          # The base branch may predate the size-limit setup (while the PR
          # introducing it is open); report no baseline in that case.
          if [ -f .size-limit.json ]; then
            pnpm install
            pnpm run build
            pnpm exec size-limit --json > "$RUNNER_TEMP/base.json" || true
          else
            echo '[]' > "$RUNNER_TEMP/base.json"
          fi
      - name: Build report
        run: |
          node "$RUNNER_TEMP/report.mjs" "$RUNNER_TEMP"
          echo '${{ github.event.pull_request.number }}' > "$RUNNER_TEMP/pr-number"
      - uses: actions/upload-artifact@v4
        with:
          name: size-limit-report
          path: |
            ${{ runner.temp }}/size-limit-report.md
            ${{ runner.temp }}/pr-number
      - name: Enforce limits
        run: test "$(cat "$RUNNER_TEMP/status")" = ok
