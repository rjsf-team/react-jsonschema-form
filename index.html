<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Follows the system appearance, the default, until the app loads -->
    <meta name="color-scheme" content="light dark" />
    <title>react-jsonschema-form playground</title>
    <script>
      window.global = globalThis;
      // Shows a stored Light or Dark appearance (`APPEARANCE_STORAGE_KEY` in Layout.tsx) from the first paint
      try {
        const appearance = localStorage.getItem('rjsf-playground-appearance');
        if (appearance === 'light' || appearance === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = appearance;
        }
      } catch {
        // Storage can be blocked; the system appearance stands until the app loads
      }
    </script>
    <script type="module" crossorigin src="./assets/index-9J6CbmPu.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CMLYFFba.css">
  </head>
  <body>
    <div id="app"></div>
    <iframe id="antd-styles-iframe" style="display: none">
      <!-- Antd .less styles will be inserted here so they aren't global -->
    </iframe>
  </body>
</html>
