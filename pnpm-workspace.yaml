packages:
  - 'packages/*'

overrides:
  'sockjs>uuid': ^14.0.0
  # Fixes security issues in dompurify by overriding to safe version
  'dompurify': ^3.4.11
  # Fixes security issues in serialize-javascript by overriding to safe version
  'serialize-javascript': ^7.0.6
  # Fixes security issues in tinypool (via @docusaurus/core) and minimatch (via nx) by overriding to safe versions
  'tinypool@<2.1.2': ^2.2.0
  'minimatch@>=7.0.0 <11.0.1': ^11.0.8

allowBuilds:
  '@parcel/watcher': true
  ata-validator: true
  core-js: true
  esbuild: true
  nx: true

# @mantine/hooks imports react-dom without declaring it, which a bundler can't resolve from the global virtual store.
packageExtensions:
  '@mantine/hooks':
    peerDependencies:
      react-dom: '*'

virtualStoreType: global

minimumReleaseAgeExclude:
  - '@x0k/json-schema-merge@1.3.0'
