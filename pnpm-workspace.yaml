packages:
  - 'packages/*'

overrides:
  'sockjs>uuid': ^14.0.0
  # Fixes security issues in dompurify by overriding to safe version
  'dompurify': ^3.4.11
  # Fixes security issues in serialize-javascript by overriding to safe version
  'serialize-javascript': ^7.0.6

allowBuilds:
  '@parcel/watcher': true
  ata-validator: true
  core-js: true
  esbuild: true
  nx: true

# @mantine/hooks imports react-dom without declaring it, which a bundler can't resolve from the global virtual store.
packageExtensions:
  '@mantine/hooks':
    peerDependencies:
      react-dom: '*'

virtualStoreType: global

minimumReleaseAgeExclude:
  - vite@8.3.2
  - ata-validator@1.56.0
  - '@ata-validator/native-darwin-arm64@1.56.0'
  - '@ata-validator/native-darwin-x64@1.56.0'
  - '@ata-validator/native-linux-arm64-gnu@1.56.0'
  - '@ata-validator/native-linux-arm64-musl@1.56.0'
  - '@ata-validator/native-linux-x64-gnu@1.56.0'
  - '@ata-validator/native-linux-x64-musl@1.56.0'
  - '@ata-validator/native-win32-x64@1.56.0'
