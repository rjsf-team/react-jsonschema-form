packages:
  - 'packages/*'

overrides:
  # Pins every peer-resolved react/react-dom to a single version, so pnpm's peer resolution
  # can't fork the graph into multiple react copies paired with mismatched react-dom copies
  # (verified: without this, `pnpm why react` shows both react@19.2.8 and react@19.3.0
  # installed, with react-dom@19.3.0 paired against react@19.2.8 in part of the tree — hooks
  # break across that boundary since react-dom must share the exact react module instance)
  'react': ^19.3.0
  'react-dom': ^19.3.0
  'sockjs>uuid': ^14.0.0
  # Fixes security issues in form-data by overriding to safe version
  'form-data': ^4.0.6
  'axios>form-data': ^4.0.6
  # Fixes security issues in tmp by overriding to safe version
  'nx>tmp': ^0.2.7
  # Fixes security issues in dompurify by overriding to safe version
  'dompurify': ^3.4.11
  'monaco-editor>dompurify': ^3.4.11
  # Fixes security issues in undici by overriding to safe version
  'undici': ^7.28.0
  # Fixes security issues in serialize-javascript by overriding to safe version
  'serialize-javascript': ^7.0.6
  # Fixes security issues in http-proxy-middleware by overriding to safe version
  'http-proxy-middleware': ^2.0.10

onlyBuiltDependencies:
  - '@parcel/watcher'
  - ata-validator
  - core-js
  - esbuild
  - nx

allowBuilds:
  '@parcel/watcher': true
  ata-validator: true
  core-js: true
  esbuild: true
  nx: true

minimumReleaseAgeExclude:
  - '@mantine/core@9.6.1'
  - '@mantine/dates@9.6.1'
  - '@mantine/hooks@9.6.1'
  - '@types/react-dom@19.3.0'
  - '@types/react@19.3.0'
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
